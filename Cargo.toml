[package]
name = "lumi-email"
version = "1.0.4"
edition = "2021"
authors = ["Lumi <team@lumi.email>"]
description = "Official Rust SDK for Lumi Email Infrastructure Platform"
homepage = "https://lumi.email"
documentation = "https://docs.rs/lumi-email"
repository = "https://github.com/deveterim/lumi-rust"
readme = "README.md"
license = "MIT"
keywords = ["lumi", "email", "transactional", "sdk", "api"]
categories = ["email", "api-bindings", "web-programming"]

[lib]
name = "lumi"
path = "src/lib.rs"

[dependencies]
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["full"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
