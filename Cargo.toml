[package]
name = "mailifica"
version = "1.0.4"
edition = "2021"
authors = ["Mailifica <team@mailifica.com>"]
description = "Official Rust SDK for Mailifica Email Infrastructure Platform"
homepage = "https://mailifica.com"
documentation = "https://docs.rs/mailifica"
repository = "https://github.com/mailifica/mailifica-rust"
readme = "README.md"
license = "MIT"
keywords = ["mailifica", "email", "transactional", "sdk", "api"]
categories = ["email", "api-bindings", "web-programming"]

[dependencies]
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["full"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
